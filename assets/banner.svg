<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Hello, I am Sumaiya, a WordPress, React and Next.js developer." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1B6E"/>
      <stop offset="1" stop-color="#14144F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2D2DC8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2D2DC8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- quiet grid texture -->
  <g stroke="#EEF0FC" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280"/>
    <path d="M160 0V360M320 0V360M480 0V360M640 0V360M800 0V360M960 0V360M1120 0V360"/>
  </g>

  <!-- left: identity -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="80" y="170" font-size="60" font-weight="700" letter-spacing="-1"><tspan fill="#C7C8EE">Hello, I am </tspan><tspan fill="#FFFFFF">Sumaiya</tspan></text>

    <!-- stack chips -->
    <g font-size="16" font-weight="600" fill="#EEF0FC" text-anchor="middle">
      <rect x="80"  y="212" width="120" height="38" rx="19" fill="#2424A0"/><text x="140" y="236">WordPress</text>
      <rect x="214" y="212" width="90"  height="38" rx="19" fill="#2424A0"/><text x="259" y="236">React</text>
      <rect x="318" y="212" width="100" height="38" rx="19" fill="#2424A0"/><text x="368" y="236">Next.js</text>
      <rect x="432" y="212" width="80"  height="38" rx="19" fill="#2424A0"/><text x="472" y="236">PHP</text>
      <rect x="526" y="212" width="140" height="38" rx="19" fill="#2424A0"/><text x="596" y="236">Tailwind CSS</text>
    </g>
  </g>

  <!-- right: code card -->
  <g>
    <rect x="800" y="56" width="400" height="248" rx="18" fill="#0F0F45" fill-opacity="0.85" stroke="#C7C8EE" stroke-opacity="0.25"/>
    <circle cx="830" cy="86" r="6" fill="#FFB020"/>
    <circle cx="852" cy="86" r="6" fill="#C7C8EE" fill-opacity="0.6"/>
    <circle cx="874" cy="86" r="6" fill="#2D2DC8"/>
    <line x1="800" y1="110" x2="1200" y2="110" stroke="#C7C8EE" stroke-opacity="0.15"/>

    <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#C7C8EE">
      <text x="830" y="144">const <tspan fill="#FFFFFF">developer</tspan> = {</text>
      <text x="854" y="174">role: <tspan fill="#FFB020">'CTO, Tekrawab'</tspan>,</text>
      <text x="854" y="204">cms: <tspan fill="#FFB020">'WordPress'</tspan>,</text>
      <text x="854" y="234">ui: [<tspan fill="#FFB020">'React'</tspan>, <tspan fill="#FFB020">'Next.js'</tspan>],</text>
      <text x="830" y="264">};</text>
    </g>
  </g>
</svg>
